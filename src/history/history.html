<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Snapture — History</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="./history.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <img src="../icons/icon-32.png" width="20" height="20" alt="" />
          <span>Snapture</span>
        </div>
        <div class="topbar-actions">
          <span class="count-label" id="countLabel">0 of 25</span>
          <button class="btn btn-secondary" id="clearBtn" type="button">Clear history</button>
          <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings" title="Settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8" />
              <path
                d="M19.4 13.5c.1-.5.1-1 0-1.5l1.9-1.3-1.5-2.6-2.2.8a7.6 7.6 0 0 0-1.3-.8l-.3-2.3H10.7l-.3 2.3c-.5.2-.9.5-1.3.8l-2.2-.8-1.5 2.6 1.9 1.3c-.1.5-.1 1 0 1.5l-1.9 1.3 1.5 2.6 2.2-.8c.4.3.8.6 1.3.8l.3 2.3h3.3l.3-2.3c.5-.2.9-.5 1.3-.8l2.2.8 1.5-2.6-1.9-1.3Z"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <main class="content">
        <div class="empty-state" id="emptyState" hidden>
          <p>No screenshots yet.</p>
          <p class="muted">Capture a page from the extension popup to see it here.</p>
        </div>
        <div class="history-disabled" id="historyDisabledState" hidden>
          <p>History is turned off.</p>
          <p class="muted">Enable it in Settings to keep a record of your captures.</p>
        </div>
        <div class="grid" id="grid"></div>
      </main>
    </div>

    <template id="cardTemplate">
      <article class="card history-card">
        <button class="thumb-button" type="button">
          <img class="thumb" alt="" />
        </button>
        <div class="card-body">
          <p class="card-title"></p>
          <p class="card-meta"></p>
        </div>
        <div class="card-actions">
          <button class="link-button open-btn" type="button">Open</button>
          <button class="link-button delete-btn" type="button">Delete</button>
        </div>
      </article>
    </template>

    <script type="module" src="./history.js"></script>
  </body>
</html>
