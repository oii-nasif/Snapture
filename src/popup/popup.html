<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Snapture</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <img src="../icons/icon-32.png" width="22" height="22" alt="" />
          <span class="brand-name">Snapture</span>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M19.4 13.5c.1-.5.1-1 0-1.5l1.9-1.3-1.5-2.6-2.2.8a7.6 7.6 0 0 0-1.3-.8l-.3-2.3H10.7l-.3 2.3c-.5.2-.9.5-1.3.8l-2.2-.8-1.5 2.6 1.9 1.3c-.1.5-.1 1 0 1.5l-1.9 1.3 1.5 2.6 2.2-.8c.4.3.8.6 1.3.8l.3 2.3h3.3l.3-2.3c.5-.2.9-.5 1.3-.8l2.2.8 1.5-2.6-1.9-1.3Z"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </header>

      <div class="status-row" role="status" aria-live="polite">
        <span class="status-dot" id="statusDot" data-state="idle"></span>
        <span class="status-text" id="statusText">Ready</span>
      </div>

      <div class="progress-track" id="progressTrack" hidden>
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel" hidden></div>

      <button class="btn btn-secondary" id="cancelCapture" type="button" hidden>Cancel capture</button>

      <div class="error-banner" id="errorBanner" hidden></div>

      <main class="actions">
        <button class="btn btn-primary" id="captureFullPage" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <rect x="8" y="8" width="8" height="8" rx="1.2" stroke="currentColor" stroke-width="1.6" />
          </svg>
          Capture Full Page
        </button>
        <button class="btn btn-secondary" id="captureVisible" type="button">Capture Visible Area</button>
        <button class="btn btn-secondary" id="captureSelection" type="button">Capture Selected Area</button>
      </main>

      <div class="divider"></div>

      <div class="secondary-actions">
        <button class="link-button" id="copyLast" type="button">Copy last screenshot</button>
        <button class="link-button" id="openHistory" type="button">Screenshot history</button>
      </div>
    </div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
